<!DOCTYPE html>
<html>
<head>
    <title>Theme Switcher</title>

    <style>
        body {
            background-color: white;
            color: black;
            text-align: center;
        }

        .dark {
            background-color: black;
            color: white;
        }
    </style>
</head>

<body>

    <h1>Dynamic Theme Switcher</h1>

    <button onclick="changeTheme()">Dark / Light</button>

    <script>
        function changeTheme() {
            document.body.classList.toggle("dark");
        }
    </script>

</body>
</html>
